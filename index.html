<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoceMagia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>

    </header>
    <main>
        <section id="Inicio">

        </section>

        <section id="Produtos">
            <div>
                <input type="text" placeholder="Buscar produto...">
                <button>
                    <h4>+ Novo produto</h4>
                </button>
            </div>
            <table>
                <tr>
                    <th>Produto</th>
                    <th>Categoria</th>
                    <th>Preço</th>
                    <th>Produção</th>
                </tr>
                <tr>
                    <td>Bolo de Chocolate</td>
                    <td>Bolo</td>
                    <td>R$ 85,00</td>
                    <td>240 min</td>
                </tr>
                <tr>
                    <td>Torta de Morango</td>
                    <td>Torta</td>
                    <td>R$ 75,00</td>
                    <td>200 min</td>
                </tr>
                <tr>
                    <td>Torta de Limão</td>
                    <td>Torta</td>
                    <td>R$ 70,00</td>
                    <td>180 min</td>
                </tr>
            </table>
            <div>
                <div>
                    <h4>Novo produto</h2>
                    <button> x</button>
                </div>
                <label>
                    Nome do produto
                    <input type="text" placeholder="Ex: Bolo de cenoura">
                </label>
                <label>Categoria
                    <select>
                        <option>Bolo</option>
                        <option>Torta</option>
                        <option>Brigadeiro</option>
                        <option>Outro</option>
                    </select>
                </label>
                <div>
                    <label>
                        Preço(R$)
                        <input type="number" step="0.01" min="0" placeholder="0.00">
                    </label>
                    <label>
                        Tempo de produção(min)
                        <input type="number" min="0" placeholder="60">
                    </label>
                </div>

            </div>
        </section>

        <section id="ingredientes">

        </section>

        <section id="Encomendas">

        </section>

        <section id="VendaBalcão">

        </section>

        <section id="Relatorios">

        </section>
    </main>
    <footer>
        <button>
            <p>Inicio</p>
        </button>
        <button>
            <p>Produtos</p>
        </button>
        <button>
            <p>Ingredientes</p>
        </button>
        <button>
            <p>Encomendas</p>
        </button>
        <button>
            <p>Venda Balcão</p>
        </button>
        <button>
            <p>Relatorios</p>
        </button>
    </footer>
</body>
</html>
