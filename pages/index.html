<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DoceMagia</title>
    <link rel="stylesheet" href="../styles/style.css" />
    <script src="../scripts/script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>DoceMagia</h1>
    </header>

    <main>
      <section id="Inicio" class="tela active">
        <h2>Inicio</h2>

        <div class="cards-dashboard">
          <div class="card-dashboard">
            <h3>Vendas do dia</h3>
            <p>R$ 1.240,00</p>
          </div>
          <div class="card-dashboard">
            <h3>Encomendas ativas</h3>
            <p>6</p>
          </div>
          <div class="card-dashboard">
            <h3>Alertas de estoque</h3>
            <p>3</p>
          </div>
          <div class="card-dashboard">
            <h3>Total de produtos</h3>
            <p>18</p>
          </div>
        </div>

        <h3>Ingredientes abaixo do ponto mínimo</h3>
        <p>Açúcar, leite condensado e ovos</p>

        <h3>Encomendas recentes</h3>
        <p>Maria - Entrega hoje - Em produção</p>
        <p>João - Entrega amanhã - Pendente</p>
      </section>


      <!--         -->
     
        <section id="NovoProduto" class="painel">
          <h3>Novo produto</h3>
          <label>
            Nome do produto
            <input type="text" placeholder="Ex: Bolo de cenoura" />
          </label>
          <label
            >Categoria
            <select>
              <option>Bolo</option>
              <option>Torta</option>
              <option>Brigadeiro</option>
              <option>Cupcake</option>
            </select>
          </label>
          <label>
            Receita
            <input type="text" placeholder="Ex: farinha 2kg, ovos 6" />
          </label>
          <label>
            Preço (R$)
            <input type="number" step="0.01" min="0" placeholder="0.00" />
          </label>
          <label>
            Tempo de produção(min)
            <input type="number" min="0" placeholder="60" />
          </label>
          <button type="button" id="btnFecharNovoProduto">Voltar</button>
          <button type="button">Salvar produto</button>
        </section>


      <!--         -->


      </section>
      
    </main>

    <footer>
      <button id="btnInicio"><a href="index.html">Inicio</a></button>
      <button id="btnProdutos"><a href="produtos.html">Produtos</a></button>
      <button id="btnIngredientes"><a href="ingredientes.html">Ingredientes</a></button>
      <button id="btnClientes"><a href="clientes.html">Clientes</a></button>
      <button id="btnEncomendas"><a href="encomendas.html">Encomendas</a></button>
      <button id="btnVendaBalcao"><a href="balcao.html">Venda Balcão</a></button>
      <button id="btnRelatorios"><a href="relatorios.html">Relatorios</a></button>
    </footer>
  </body>
</html>
