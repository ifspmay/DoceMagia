<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovoProduto</title>
    <link rel="stylesheet" href="../styles/style.css" />
    <script src="../scripts/script.js" defer></script>
</head>
<body>
    <section id="NovoProduto" class="painel">
          <h3>Novo produto</h3>
          <label>
            Nome do produto
            <input type="text" placeholder="Ex: Bolo de cenoura" />
          </label>
          <label
            >Categoria
            <select>
              <option>Bolo</option>
              <option>Torta</option>
              <option>Brigadeiro</option>
              <option>Cupcake</option>
            </select>
          </label>
          <label>
            Receita
            <input type="text" placeholder="Ex: farinha 2kg, ovos 6" />
          </label>
          <label>
            Preço (R$)
            <input type="number" step="0.01" min="0" placeholder="0.00" />
          </label>
          <label>
            Tempo de produção(min)
            <input type="number" min="0" placeholder="60" />
          </label>
          <button type="button" id="btnFecharNovoProduto"><a href="produtos.html"> Voltar</a></button>
          <button type="button">Salvar produto</button>
        </section>
</body>
</html>
