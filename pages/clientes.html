<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes</title>
    <link rel="stylesheet" href="../styles/style.css" />
    <style>
      #erroClientes{
        border: 1px solid;
        border-radius: 5px;
        background-color: #ed7070;
        width: fit-content;
        margin: 10px;
        padding: 5px 12px;
        text-align: center;
        white-space: nowrap;
      }
    </style>
</head>
<body>
    <section id="Clientes" class="tela">
        <h2>Clientes</h2>

        <div id="listaClientes" class="painel active">
          <div>
            <input id="buscaCliente" type="text" placeholder="Buscar cliente..." />
            <button id="btnNovoCliente"><a href="novoCliente.html">+ Novo cliente</a></button>
          </div>

          
          <p id="loadingClientes">Carregando clientes...</p>
          <p id="erroClientes" hidden></p>

          <table id="tabelaClientes">
            <thead>
              <tr>
                <th>Cliente</th>
                <th>Telefone</th>
                <th>E-mail</th>
              </tr>
            </thead>
            <tbody id="corpoTabelaClientes"></tbody>
          </table>
        </div>

    <footer>
      <button id="btnInicio"><a href="index.html">Inicio</a></button>
      <button id="btnProdutos"><a href="produtos.html">Produtos</a></button>
      <button id="btnIngredientes"><a href="ingredientes.html">Ingredientes</a></button>
      <button id="btnClientes"><a href="clientes.html">Clientes</a></button>
      <button id="btnEncomendas"><a href="encomendas.html">Encomendas</a></button>
      <button id="btnVendaBalcao"><a href="balcao.html">Venda Balcão</a></button>
      <button id="btnRelatorios"><a href="relatorios.html">Relatorios</a></button>
    </footer>
    <script>
      const API_URL = 'http://10.124.75.2:8080/api/v1';
      const corpoTabelaClientes = document.getElementById('corpoTabelaClientes');
      const loadingClientes = document.getElementById('loadingClientes');
      const erroClientes = document.getElementById('erroClientes');
      const buscaCliente = document.getElementById('buscaCliente');
      let clientes = [];

      function renderizarClientes() {
        const termo = buscaCliente.value.trim().toLocaleLowerCase('pt-BR');
        const filtrados = clientes.filter((cliente) => {
          const dadosCliente = [cliente.nomeC || cliente.nome, cliente.telefone, cliente.emailC || cliente.email]
            .filter(Boolean)
            .join(' ')
            .toLocaleLowerCase('pt-BR');
          return dadosCliente.includes(termo);
        });

        corpoTabelaClientes.replaceChildren();
        filtrados.forEach((cliente) => {
          const linha = document.createElement('tr');
          [cliente.nomeC || cliente.nome || '-', cliente.telefone || '-', cliente.emailC || cliente.email || '-']
            .forEach((valor) => {
              const celula = document.createElement('td');
              celula.textContent = valor;
              linha.appendChild(celula);
            });
          corpoTabelaClientes.appendChild(linha);
        });
      }

      async function carregarClientes() {
        loadingClientes.hidden = false;
        erroClientes.hidden = true;
        try {
          const resposta = await fetch(`${API_URL}/clientes`);
          if (!resposta.ok) throw new Error(`HTTP ${resposta.status}`);
          clientes = await resposta.json();
          renderizarClientes();
        } catch (erro) {
          erroClientes.textContent = `Erro ao carregar clientes: ${erro.message}`;
          erroClientes.hidden = false;
        } finally {
          loadingClientes.hidden = true;
        }
      }

      buscaCliente.addEventListener('input', renderizarClientes);
      document.addEventListener('DOMContentLoaded', carregarClientes);
    </script>
</body>
</html>
