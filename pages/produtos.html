<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos</title>
    <!-- <link rel="stylesheet" href="../styles/produtos.css" /> -->
    <script src="../scripts/script.js" defer></script>
</head>
<body>
    <section id="Produtos" class="tela">
        <div id="produtosLista" class="painel active">
          <h2>Produtos</h2>

          <div>
            <input type="text" placeholder="Buscar produto..." />
            <button id="btnNovoProduto">+ Novo produto</button>
          </div>

          <table>
            <tr>
              <th>Imagens</th>
              <th>Produto</th>
              <th>Categoria</th>
              <th>Preço</th>
              <th>Produção</th>
              <th>Ingredientes</th>
            </tr>
            <tr>
              <td><img src="../imgs/BoloDeChocolate.png" alt="BoloDeChocolate"> </td>
              <td>Bolo de Chocolate</td>
              <td>Bolo</td>
              <td>R$ 85,00</td>
              <td>240 min</td>
              <td>5</td>
            </tr>
            <tr>
              <td><img src="../imgs/TortaDeMorango.png" alt="TortaDeMorango"></td>
              <td>Torta de Morango</td>
              <td>Torta</td>
              <td>R$ 75,00</td>
              <td>200 min</td>
              <td>4</td>
            </tr>
              <td><img src="../imgs/Brigadeiro.png" alt="Brigadeiro" ></td>
              <td>Brigadeiro</td>
              <td>Brigadeiro</td>
              <td>R$ 8,00</td>
              <td>30 min</td>
              <td>3</td>
            </tr>
          </table>
        </div>

    <footer>
      <button id="btnInicio">Inicio</button>
      <button id="btnProdutos">Produtos</button>
      <button id="btnIngredientes">Ingredientes</button>
      <button id="btnClientes">Clientes</button>
      <button id="btnEncomendas">Encomendas</button>
      <button id="btnVendaBalcao">Venda Balcão</button>
      <button id="btnRelatorios">Relatorios</button>
    </footer>
</body>
</html>
