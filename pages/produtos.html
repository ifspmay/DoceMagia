
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos</title>
    <link rel="stylesheet" href="../styles/style.css" />
    <script src="../scripts/script.js" defer></script>
</head>
<body>
  <header>
      <h1>DoceMagia</h1>
    </header>

    <section id="Produtos" class="tela">
        <div id="produtosLista" class="painel active">
          <h2>Produtos</h2>
          
          <div>
            <input type="text" placeholder="Buscar produto..." />
            <button id="btnNovoProduto"><a href="novoProduto.html">+ Novo produto  </a></button>
          </div>

          <!-- PRODUTOS -->
          <section class="products-section">
              <div class="container">
                  <h1 class="section-title">🍰 Todos os Produtos</h1>
                  
                  <div class="filters-container">
                      <div class="search-box">
                          <input 
                              type="text" 
                              id="searchInput" 
                              placeholder="🔍 Buscar produtos..."
                          />
                      </div>
                      <div class="filters">
                          <select id="categoryFilter">
                              <option value="">Todas categorias</option>
                          </select>
                          <select id="sortFilter">
                              <option value="nome">Ordenar por Nome</option>
                              <option value="preco">Ordenar por Preço</option>
                              <option value="avaliacao">Ordenar por Avaliação</option>
                          </select>
                          <button id="clearFilters" class="btn-clear">Limpar Filtros</button>
                      </div>
                  </div>

                  <div id="productsContainer" class="product-grid">
                      <!-- Carregado via JavaScript -->
                  </div>

                  <div id="pagination" class="pagination">
                      <!-- Carregado via JavaScript -->
                  </div>
              </div>


              <!-- MODAL CARRINHO -->
              <div id="cartModal" class="modal">
                  <div class="modal-content">
                      <span class="modal-close">&times;</span>
                      <h2>🛒 Seu Carrinho</h2>
                      <div id="cartItems" class="cart-items">
                          <p class="empty-cart">Seu carrinho está vazio</p>
                      </div>
                      <div class="cart-total">
                          <strong>Total:</strong> <span id="cartTotal">R$ 0,00</span>
                      </div>
                      <button id="checkoutBtn" class="btn-primary">Finalizar Pedido</button>
                  </div>
              </div>

              <!-- MODAL PRODUTO -->
              <div id="productModal" class="modal">
                  <div class="modal-content modal-product">
                      <span class="modal-close">&times;</span>
                      <div id="productDetailContent">
                          <!-- Carregado via JavaScript -->
                      </div>
                  </div>
              </div>

          </section>
        </div>


    <footer>
      <button id="btnInicio"><a href="index.html">Inicio</a></button>
      <button id="btnProdutos"><a href="produtos.html">Produtos</a></button>
      <button id="btnIngredientes"><a href="ingredientes.html">Ingredientes</a></button>
      <button id="btnClientes"><a href="clientes.html">Clientes</a></button>
      <button id="btnEncomendas"><a href="encomendas.html">Encomendas</a></button>
      <button id="btnVendaBalcao"><a href="balcao.html">Venda Balcão</a></button>
      <button id="btnRelatorios"><a href="relatorios.html">Relatorios</a></button>
    </footer>

    <script src="js/utils/formatters.js"></script>
    <script src="js/api.js"></script>
    <script src="js/components/ProductCard.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
