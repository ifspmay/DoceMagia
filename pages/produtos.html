
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos</title>
    <link rel="stylesheet" href="../styles/novoProduto.css" />

</head>
<body>
  <header>
      <h1>DoceMagia</h1>
    </header>

    <h1>🍰 Lista de Produtos</h1>

    <a class="botao" href="novoProduto.html">Adicionar Produto</a>

    <div id="mensagem" class="mensagem"></div>
    <div id="loading" class="loading">⏳ Carregando produtos...</div>

    <!-- TABELA -->
    <table id="tabelaProdutos" style="display: none;">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Preço</th>
                <th>Tempo</th>
                <th>Categoria</th>
                <th>Destaque</th>
                <th>Disponível</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="corpoTabela"></tbody>
    </table>

    <!-- ========================================
         MODAL DE EDIÇÃO
         ======================================== -->
    <div id="modalEdicao" class="modal">
        <div class="modal-conteudo">
            <div class="modal-titulo">
                <span>✏️ Editar Produto</span>
                <button class="btn-fechar" onclick="fecharModal()">&times;</button>
            </div>

            <form id="formEdicao" onsubmit="salvarEdicao(event)">
                <input type="hidden" id="editId" />

                <div class="form-group">
                    <label>Nome *</label>
                    <input type="text" id="editNome" required maxlength="200" />
                </div>

                <div class="form-group">
                    <label>Descrição</label>
                    <textarea id="editDescricao" maxlength="1000"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Preço (R$) *</label>
                        <input type="number" id="editPreco" step="0.01" min="0.01" required />
                    </div>

                    <div class="form-group">
                        <label>Preço Promocional (R$)</label>
                        <input type="number" id="editPrecoPromocional" step="0.01" min="0" />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Tempo de Preparo (min) *</label>
                        <input type="number" id="editTempoPreparo" min="1" required />
                    </div>

                    <div class="form-group">
                        <label>Categoria *</label>
                        <select id="editCategoriaId" required>
                            <option value="">Selecione...</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Ingredientes</label>
                    <textarea id="editIngredientes" maxlength="1000"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Peso</label>
                        <input type="text" id="editPeso" maxlength="50" />
                    </div>

                    <div class="form-group">
                        <label>Imagem</label>
                        <input type="text" id="editImagem" maxlength="255" />
                    </div>
                </div>

                <div class="form-group">
                    <label>Opções</label>
                    <div class="checkbox-group">
                        <label class="checkbox-item">
                            <input type="checkbox" id="editDestaque" />
                            <span>⭐ Destaque</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" id="editDisponivel" />
                            <span>✅ Disponível</span>
                        </label>
                    </div>
                </div>

                <div class="modal-botoes">
                    <button type="button" class="btn-cancelar" onclick="fecharModal()">
                        Cancelar
                    </button>
                    <button type="submit" class="btn-salvar" id="btnSalvar">
                        💾 Salvar Alterações
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ========================================
        // CONFIGURAÇÃO
        // ========================================
        const API_URL = 'http://10.124.75.2:8080/api/v1';

        // ========================================
        // ELEMENTOS
        // ========================================
        const corpoTabela = document.getElementById('corpoTabela');
        const tabela = document.getElementById('tabelaProdutos');
        const loading = document.getElementById('loading');
        const mensagem = document.getElementById('mensagem');
        const modal = document.getElementById('modalEdicao');
        const btnSalvar = document.getElementById('btnSalvar');

        // Cache de categorias
        let categoriasCache = [];

        // ========================================
        // MENSAGENS
        // ========================================
        function mostrarMensagem(texto, tipo = 'sucesso') {
            mensagem.textContent = texto;
            mensagem.className = `mensagem ${tipo}`;
            setTimeout(() => {
                mensagem.className = 'mensagem';
            }, 4000);
        }

        // ========================================
        // FORMATAÇÃO
        // ========================================
        function formatarPreco(valor) {
            if (valor === null || valor === undefined) return '-';
            return `R$ ${valor.toFixed(2).replace('.', ',')}`;
        }

        // ========================================
        // CARREGAR PRODUTOS
        // ========================================
        async function carregarProdutos() {
            loading.style.display = 'block';
            tabela.style.display = 'none';

            try {
                const resposta = await fetch(`${API_URL}/produtos`);
                if (!resposta.ok) throw new Error(`HTTP ${resposta.status}`);

                const produtos = await resposta.json();

                let html = '';
                produtos.forEach(p => {
                    html += `
                        <tr data-id="${p.id}">
                            <td>${p.id}</td>
                            <td><strong>${p.nome}</strong></td>
                            <td>${formatarPreco(p.precoPromocional || p.preco)}</td>
                            <td>${p.tempoPreparo} min</td>
                            <td>${p.categoria ? p.categoria.icone + ' ' + p.categoria.nome : '-'}</td>
                            <td>
                                <span class="badge ${p.destaque ? 'badge-sim' : 'badge-nao'}">
                                    ${p.destaque ? 'Sim' : 'Não'}
                                </span>
                            </td>
                            <td>
                                <span class="badge ${p.disponivel ? 'badge-sim' : 'badge-nao'}">
                                    ${p.disponivel ? 'Sim' : 'Não'}
                                </span>
                            </td>
                            <td>
                                <button class="btn btn-editar" onclick="abrirEdicao(${p.id})">
                                    ✏️ Editar
                                </button>
                                <button class="btn btn-apagar" onclick="apagarProduto(${p.id}, '${p.nome.replace(/'/g, "\\'")}')">
                                    🗑️ Apagar
                                </button>
                            </td>
                        </tr>
                    `;
                });

                corpoTabela.innerHTML = html;
                tabela.style.display = 'table';
                loading.style.display = 'none';

            } catch (erro) {
                console.error('❌ Erro:', erro);
                loading.innerHTML = `❌ Erro ao carregar: ${erro.message}`;
                mostrarMensagem('Erro ao carregar produtos', 'erro');
            }
        }

        // ========================================
        // CARREGAR CATEGORIAS (para o select)
        // ========================================
        async function carregarCategorias() {
            try {
                const resposta = await fetch(`${API_URL}/categorias/ativas`);
                if (!resposta.ok) throw new Error(`HTTP ${resposta.status}`);

                categoriasCache = await resposta.json();

                const select = document.getElementById('editCategoriaId');
                select.innerHTML = '<option value="">Selecione...</option>';

                categoriasCache.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat.id;
                    option.textContent = `${cat.icone || '📦'} ${cat.nome}`;
                    select.appendChild(option);
                });

            } catch (erro) {
                console.error('❌ Erro ao carregar categorias:', erro);
            }
        }

        // ========================================
        // ABRIR MODAL DE EDIÇÃO (COM DADOS DA LINHA)
        // ========================================
        async function abrirEdicao(id) {
            try {
                // Busca o produto específico da API
                const resposta = await fetch(`${API_URL}/produtos/${id}`);
                if (!resposta.ok) throw new Error(`HTTP ${resposta.status}`);

                const produto = await resposta.json();

                // Preenche o formulário com os dados
                document.getElementById('editId').value = produto.id;
                document.getElementById('editNome').value = produto.nome || '';
                document.getElementById('editDescricao').value = produto.descricao || '';
                document.getElementById('editPreco').value = produto.preco || '';
                document.getElementById('editPrecoPromocional').value = produto.precoPromocional || '';
                document.getElementById('editTempoPreparo').value = produto.tempoPreparo || '';
                document.getElementById('editCategoriaId').value = produto.categoria?.id || '';
                document.getElementById('editIngredientes').value = produto.ingredientes || '';
                document.getElementById('editPeso').value = produto.peso || '';
                document.getElementById('editImagem').value = produto.imagem || '';
                document.getElementById('editDestaque').checked = produto.destaque || false;
                document.getElementById('editDisponivel').checked = produto.disponivel || false;

                // Abre o modal
                modal.classList.add('aberto');
                document.getElementById('editNome').focus();

            } catch (erro) {
                console.error('❌ Erro:', erro);
                mostrarMensagem(`Erro ao carregar produto: ${erro.message}`, 'erro');
            }
        }

        // ========================================
        // FECHAR MODAL
        // ========================================
        function fecharModal() {
            modal.classList.remove('aberto');
            document.getElementById('formEdicao').reset();
        }

        // Fechar ao clicar fora do modal
        modal.addEventListener('click', (e) => {
            if (e.target === modal) fecharModal();
        });

        // Fechar com ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('aberto')) {
                fecharModal();
            }
        });

        // ========================================
        // SALVAR EDIÇÃO (PUT)
        // ========================================
        async function salvarEdicao(evento) {
            evento.preventDefault();

            const id = document.getElementById('editId').value;

            // Monta o objeto
            const dados = {
                nome: document.getElementById('editNome').value.trim(),
                descricao: document.getElementById('editDescricao').value.trim() || null,
                preco: parseFloat(document.getElementById('editPreco').value),
                precoPromocional: document.getElementById('editPrecoPromocional').value 
                    ? parseFloat(document.getElementById('editPrecoPromocional').value) 
                    : null,
                tempoPreparo: parseInt(document.getElementById('editTempoPreparo').value),
                categoriaId: parseInt(document.getElementById('editCategoriaId').value),
                ingredientes: document.getElementById('editIngredientes').value.trim() || null,
                peso: document.getElementById('editPeso').value.trim() || null,
                imagem: document.getElementById('editImagem').value.trim() || null,
                destaque: document.getElementById('editDestaque').checked,
                disponivel: document.getElementById('editDisponivel').checked
            };

            // Validações simples
            if (dados.precoPromocional && dados.precoPromocional >= dados.preco) {
                mostrarMensagem('Preço promocional deve ser menor que o preço normal', 'erro');
                return;
            }

            // Desabilita botão
            btnSalvar.disabled = true;
            btnSalvar.textContent = '⏳ Salvando...';

            try {
                const resposta = await fetch(`${API_URL}/produtos/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                if (!resposta.ok) {
                    let msg = `HTTP ${resposta.status}`;
                    try {
                        const erro = await resposta.json();
                        if (erro.message) msg = erro.message;
                    } catch (e) {}
                    throw new Error(msg);
                }

                const atualizado = await resposta.json();
                mostrarMensagem(`✅ Produto "${atualizado.nome}" atualizado!`, 'sucesso');
                
                fecharModal();
                carregarProdutos();

            } catch (erro) {
                console.error('❌ Erro:', erro);
                mostrarMensagem(`Erro ao salvar: ${erro.message}`, 'erro');
            } finally {
                btnSalvar.disabled = false;
                btnSalvar.textContent = '💾 Salvar Alterações';
            }
        }

        // ========================================
        // APAGAR PRODUTO (DELETE)
        // ========================================
        async function apagarProduto(id, nome) {
            if (!confirm(`Apagar o produto "${nome}"?`)) return;

            try {
                const resposta = await fetch(`${API_URL}/produtos/${id}`, {
                    method: 'DELETE'
                });

                if (!resposta.ok) throw new Error(`HTTP ${resposta.status}`);

                mostrarMensagem(`✅ Produto "${nome}" apagado!`, 'sucesso');
                
                const linha = document.querySelector(`tr[data-id="${id}"]`);
                if (linha) linha.remove();

                if (corpoTabela.children.length === 0) carregarProdutos();

            } catch (erro) {
                console.error('❌ Erro:', erro);
                mostrarMensagem(`Erro ao apagar: ${erro.message}`, 'erro');
            }
        }

        // ========================================
        // INICIALIZAÇÃO
        // ========================================
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🍰 Iniciando...');
            await carregarCategorias(); // Carrega categorias primeiro
            await carregarProdutos();   // Depois os produtos
        });
    </script>

    <footer>
      <button id="btnInicio"><a href="index.html">Inicio</a></button>
      <button id="btnProdutos"><a href="produtos.html">Produtos</a></button>
      <button id="btnIngredientes"><a href="ingredientes.html">Ingredientes</a></button>
      <button id="btnClientes"><a href="clientes.html">Clientes</a></button>
      <button id="btnEncomendas"><a href="encomendas.html">Encomendas</a></button>
      <button id="btnVendaBalcao"><a href="balcao.html">Venda Balcão</a></button>
      <button id="btnRelatorios"><a href="relatorios.html">Relatorios</a></button>
    </footer>

    <script src="js/utils/formatters.js"></script>
    <script src="js/api.js"></script>
    <script src="js/components/ProductCard.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
