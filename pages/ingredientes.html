<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingredientes</title>
    <link rel="stylesheet" href="../styles/novoIngrediente.css" />

</head>
<body>
    <section id="Ingredientes" class="tela">
        <h2>Ingredientes</h2>

        <div id="listaIngredientes" class="painel active">
          <div>
            <input id="buscaIngrediente" type="text" placeholder="Buscar ingrediente..." />
            <button id="btnNovoIngrediente"><a href="novoIngrediente.html">+ Novo ingrediente</a></button>
          </div>

          <p id="avisoEstoque"></p>
          <p id="loadingIngredientes">Carregando ingredientes...</p>
          <p id="erroIngredientes" hidden></p>

          <table id="tabelaIngredientes">
            <thead>
              <tr>
                <th>Ingrediente</th>
                <th>Unidade</th>
                <th>Disponível</th>
                <th>Ponto mínimo</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="corpoTabelaIngredientes"></tbody>
          </table>

          <button id="btnReabastecer" type="button">Reabastecer</button>
        </div>

      </section>

      <div id="modalReabastecer" class="modal" role="dialog" aria-modal="true" aria-labelledby="tituloReabastecer">
        <div class="modal-conteudo">
          <div class="modal-titulo">
            <span id="tituloReabastecer">Reabastecer ingrediente</span>
            <button class="btn-fechar" type="button" id="btnFecharReabastecer" aria-label="Fechar">&times;</button>
          </div>
          <form id="formReabastecer">
            <div class="form-group">
              <label for="ingredienteReabastecer">Ingrediente</label>
              <select id="ingredienteReabastecer" required></select>
            </div>
            <div class="form-group">
              <label for="quantidadeReabastecer">Quantidade a adicionar</label>
              <input id="quantidadeReabastecer" type="number" min="0.01" step="any" required />
            </div>
            <div class="modal-botoes">
              <button type="button" class="btn-cancelar" id="btnCancelarReabastecer">Cancelar</button>
              <button type="button" class="btn-salvar">Salvar</button>
            </div>
          </form>
        </div>
      </div>

    <footer>
      <button id="btnInicio"><a href="index.html">Inicio</a></button>
      <button id="btnProdutos"><a href="produtos.html">Produtos</a></button>
      <button id="btnIngredientes"><a href="ingredientes.html">Ingredientes</a></button>
      <button id="btnClientes"><a href="clientes.html">Clientes</a></button>
      <button id="btnEncomendas"><a href="encomendas.html">Encomendas</a></button>
      <button id="btnVendaBalcao"><a href="balcao.html">Venda Balcão</a></button>
      <button id="btnRelatorios"><a href="relatorios.html">Relatorios</a></button>
    </footer>
    <script>
      const API_URL = 'http://10.124.75.2:8080/api/v1';
      const corpoTabelaIngredientes = document.getElementById('corpoTabelaIngredientes');
      const loadingIngredientes = document.getElementById('loadingIngredientes');
      const erroIngredientes = document.getElementById('erroIngredientes');
      const avisoEstoque = document.getElementById('avisoEstoque');
      const buscaIngrediente = document.getElementById('buscaIngrediente');
      const modalReabastecer = document.getElementById('modalReabastecer');
      const ingredienteReabastecer = document.getElementById('ingredienteReabastecer');
      let ingredientes = [];

      function renderizarIngredientes() {
        const termo = buscaIngrediente.value.trim().toLocaleLowerCase('pt-BR');
        const filtrados = ingredientes.filter((ingrediente) =>
          (ingrediente.nome || '').toLocaleLowerCase('pt-BR').includes(termo)
        );

        corpoTabelaIngredientes.replaceChildren();
        filtrados.forEach((ingrediente) => {
          const quantidade = Number(ingrediente.quantidade ?? ingrediente.quantidadeDisponivel ?? 0);
          const pontoMinimo = Number(ingrediente.pontoMinimo ?? 0);
          const linha = document.createElement('tr');
          [
            ingrediente.nome || '-',
            ingrediente.unidade || '-',
            quantidade,
            pontoMinimo,
            quantidade <= pontoMinimo ? 'Baixo' : 'Ok',
          ].forEach((valor) => {
            const celula = document.createElement('td');
            celula.textContent = valor;
            linha.appendChild(celula);
          });
          corpoTabelaIngredientes.appendChild(linha);
        });

        const abaixoDoMinimo = ingredientes.filter((ingrediente) =>
          Number(ingrediente.quantidade ?? ingrediente.quantidadeDisponivel ?? 0) <= Number(ingrediente.pontoMinimo ?? 0)
        );
        avisoEstoque.textContent = abaixoDoMinimo.length
          ? `Abaixo do ponto mínimo: ${abaixoDoMinimo.map((ingrediente) => ingrediente.nome).join(', ')}`
          : 'Nenhum ingrediente abaixo do ponto mínimo.';
      }

      async function carregarIngredientes() {
        loadingIngredientes.hidden = false;
        erroIngredientes.hidden = true;
        try {
          const resposta = await fetch(`${API_URL}/ingredientes`);
          if (!resposta.ok) throw new Error(`HTTP ${resposta.status}`);
          ingredientes = await resposta.json();
          renderizarIngredientes();
        } catch (erro) {
          erroIngredientes.textContent = `Erro ao carregar ingredientes: ${erro.message}`;
          erroIngredientes.hidden = false;
        } finally {
          loadingIngredientes.hidden = true;
        }
      }

      buscaIngrediente.addEventListener('input', renderizarIngredientes);
      document.getElementById('btnReabastecer').addEventListener('click', () => {
        ingredienteReabastecer.replaceChildren();
        ingredientes.forEach((ingrediente) => {
          const opcao = document.createElement('option');
          opcao.value = ingrediente.id;
          opcao.textContent = ingrediente.nome;
          ingredienteReabastecer.appendChild(opcao);
        });
        modalReabastecer.classList.add('aberto');
        ingredienteReabastecer.focus();
      });

      function fecharModalReabastecer() {
        modalReabastecer.classList.remove('aberto');
        document.getElementById('formReabastecer').reset();
      }

      document.getElementById('btnFecharReabastecer').addEventListener('click', fecharModalReabastecer);
      document.getElementById('btnCancelarReabastecer').addEventListener('click', fecharModalReabastecer);
      modalReabastecer.addEventListener('click', (evento) => {
        if (evento.target === modalReabastecer) fecharModalReabastecer();
      });
      document.addEventListener('keydown', (evento) => {
        if (evento.key === 'Escape' && modalReabastecer.classList.contains('aberto')) {
          fecharModalReabastecer();
        }
      });
      document.addEventListener('DOMContentLoaded', carregarIngredientes);
    </script>
</body>
</html>
