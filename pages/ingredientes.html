<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingredientes</title>
    <link rel="stylesheet" href="../styles/style.css" />
    <script src="../scripts/script.js" defer></script>
</head>
<body>
    <section id="Ingredientes" class="tela">
        <h2>Ingredientes</h2>

        <div id="listaIngredientes" class="painel active">
          <div>
            <input type="text" placeholder="Buscar ingrediente..." />
            <button id="btnNovoIngrediente"><a href="novoIngrediente.html">+ Novo ingrediente</a></button>
          </div>

          <p>Em falta: açúcar e leite condensado</p>

          <table>
            <tr>
              <th>Ingrediente</th>
              <th>Unidade</th>
              <th>Disponível</th>
              <th>Ponto mínimo</th>
              <th>Status</th>
            </tr>
            <tr>
              <td>Açúcar</td>
              <td>kg</td>
              <td>1,5</td>
              <td>3</td>
              <td>Baixo</td>
            </tr>
            <tr>
              <td>Farinha</td>
              <td>kg</td>
              <td>8</td>
              <td>5</td>
              <td>Ok</td>
            </tr>
          </table>

          <button id="btnReabastecer">Reabastecer</button>
        </div>

        <section id="Reabastecer" class="painel">
          <h3>Reabastecer</h3>
          <label
            >Ingrediente<select>
              <option>Açúcar</option>
              <option>Farinha</option>
              <option>Leite condensado</option>
            </select></label
          >
          <label>Quantidade a adicionar<input type="number" min="0" /></label>
          <button type="button" id="btnFecharReabastecer">Voltar</button>
          <button type="button">Salvar</button>
        </section>
      </section>

    <footer>
      <button id="btnInicio"><a href="index.html">Inicio</a></button>
      <button id="btnProdutos"><a href="produtos.html">Produtos</a></button>
      <button id="btnIngredientes"><a href="ingredientes.html">Ingredientes</a></button>
      <button id="btnClientes"><a href="clientes.html">Clientes</a></button>
      <button id="btnEncomendas"><a href="encomendas.html">Encomendas</a></button>
      <button id="btnVendaBalcao"><a href="balcao.html">Venda Balcão</a></button>
      <button id="btnRelatorios"><a href="relatorios.html">Relatorios</a></button>
    </footer>
</body>
</html>
