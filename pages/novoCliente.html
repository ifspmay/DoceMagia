<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovoCliente</title>
    <link rel="stylesheet" href="../styles/novoCliente.css" />

</head>
<body>


  <div class="container">
        <h1> Cadastro de Cliente</h1>
        <p class="subtitle">Preencha os dados do cliente para cadastrá-lo na doceria</p>

        <!-- Área de mensagens -->
        <div id="mensagem" class="mensagem"></div>

        <!-- Formulário -->
        <form id="formCliente">
            
            <!-- NOME -->
            <div class="form-group">
                <label for="nomeC">
                    Nome do Cliente <span class="required">*</span>
                </label>
                <input 
                    type="text" 
                    id="nomeC" 
                    name="nomeC"
                    placeholder="Ex: Paulão"
                    required
                    maxlength="200"
                />
            </div>

            <!-- CPF -->
            <div class="form-group">
                <label for="cpf">
                    CPF <span class="required">*</span>
                </label>
                <input 
                    type="text" 
                    id="cpf" 
                    placeholder="000.000.000-00"
                    required
                    maxlength="14"
                    autocomplete="off"
                />

                <button onclick="validar()">Validar CPF</button>

                <div id="resultado" class="resultado"></div>
            </div>

            <!-- Telefone -->
            <div class="form-group">
                <label for="telefone">
                  Telefone <span class="required">*</span>
                </label>
                <input 
                    type="text"
                    id="telefone" 
                    name="telefone"
                    placeholder="(DDD) 93288-2323"
                    required
                    maxlength="12"
                />
            </div>

            <!-- Email -->
            <div class="form-row">
                <div class="form-group">
                    <label for="emailC">
                        Email <span class="required">*</span>
                    </label>
                    <input 
                        type="email" 
                        id="emailC" 
                        name="emailC"
                        placeholder="PaulãoDaRegulagem@gmail.com"
                        required
                        maxlength="320"
                    />
                </div>
            </div>

            <!-- BOTÕES -->
            <div class="btn-group">
                <button type="button" class="btn-secondary" onclick="limparFormulario()">
                    🗑️ Limpar
                </button>
                <button type="submit" class="btn-primary" id="btnEnviar">
                    💾 Salvar
                </button>
                <button type="button">
                  <a href="clientes.html">Voltar</a>
                </button>
            </div>
        </form>
    </div>

    <script>
        // ========================================
        // CONFIGURAÇÃO
        // ========================================
        const API_URL = 'http://10.124.75.2:8080/api/v1';

        // ========================================
        // ELEMENTOS DO DOM
        // ========================================
        const form = document.getElementById('formCliente');
        const mensagem = document.getElementById('mensagem');
        const btnEnviar = document.getElementById('btnEnviar');

        // ========================================
        // MOSTRAR MENSAGEM
        // ========================================
        function mostrarMensagem(texto, tipo = 'sucesso') {
            mensagem.textContent = texto;
            mensagem.className = `mensagem ${tipo}`;

            // Esconde automaticamente após 5 segundos (exceto erro)
            if (tipo !== 'erro') {
                setTimeout(() => {
                    mensagem.className = 'mensagem';
                }, 5000);
            }
        }

        // ========================================
        // ENVIAR FORMULÁRIO (POST)
        // ========================================
        form.addEventListener('submit', async (evento) => {
            evento.preventDefault(); // Não recarrega a página

            // Desabilita o botão
            btnEnviar.disabled = true;
            btnEnviar.innerHTML = '<span class="spinner"></span> Cadastrando...';

            try {
                // ========================================
                // MONTA O OBJETO COM OS DADOS
                // ========================================
                const dados = {
                    nomeC: document.getElementById('nomeC').value.trim(),
                    telefone: document.getElementById('telefone').value.trim(),
                    emailC: document.getElementById('emailC').value.trim()
                };

                // ========================================
                // VALIDAÇÕES
                // ========================================
                if (!dados.nomeC) {
                    throw new Error('O nome do cliente é obrigatório');
                }

                if (!dados.telefone) {
                    throw new Error('O telefone é obragatório');
                }

                if (!dados.emailC) {
                    throw new Error('O email é obrigatório');
                }

                if(!dados.emailC.includes("@gmail.com")){
                  throw new Error('Complete com @gmail.com')
                }

                console.log('📤 Enviando dados:', dados);

                // ========================================
                // FAZ O POST PARA A API
                // ========================================
                const resposta = await fetch(`${API_URL}/clientes`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(dados)
                });

                // ========================================
                // TRATA A RESPOSTA
                // ========================================
                if (!resposta.ok) {
                    // Tenta pegar a mensagem de erro do back-end
                    let mensagemErro = `Erro HTTP ${resposta.status}`;
                    
                    try {
                        const erroData = await resposta.json();
                        if (erroData.message) {
                            mensagemErro = erroData.message;
                        } else if (erroData.errors) {
                            mensagemErro = Object.values(erroData.errors).join(', ');
                        }
                    } catch (e) {
                        // Ignora se não conseguir ler o JSON
                    }
                    
                    throw new Error(mensagemErro);
                }

                const clienteCriado = await resposta.json();
                console.log('✅ Cliente salvo:', clienteCriado);

                // ========================================
                // SUCESSO!
                // ========================================
                mostrarMensagem(
                    `✅ Cliente "${clienteCriado.nomeC || dados.nomeC}" cadastrado com sucesso! (ID: ${clienteCriado.id})`,
                    'sucesso'
                );

                // Limpa o formulário (mantém disponível marcado)
                limparFormulario();

            } catch (erro) {
                console.error('❌ Erro:', erro);
                mostrarMensagem(`❌ ${erro.message}`, 'erro');
            } finally {
                // Reabilita o botão
                btnEnviar.disabled = false;
                btnEnviar.innerHTML = '💾 Salvar';
            }
        });

        // ========================================
        // LIMPAR FORMULÁRIO
        // ========================================
        function limparFormulario() {
            form.reset();

            // Foca no primeiro campo
            document.getElementById('nomeC').focus();
        }

        // ========================================
        // INICIALIZAÇÃO
        // ========================================
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Cadastro de Clientes iniciado');
        });


        // ========================================
        // Verificação do cpf
        // ========================================

        // ===== Função de validação do CPF =====
        function validarCPF(cpf) {
            // Remove caracteres não numéricos
            cpf = cpf.replace(/[^\d]/g, '');

            // Verifica se tem 11 dígitos
            if (cpf.length !== 11) return false;

            // Rejeita CPFs com todos os dígitos iguais
            if (/^(\d)\1{10}$/.test(cpf)) return false;

            // Valida os dois dígitos verificadores
            for (let t = 9; t < 11; t++) {
                let soma = 0;
                for (let i = 0; i < t; i++) {
                    soma += parseInt(cpf[i]) * ((t + 1) - i);
                }
                const digito = ((soma * 10) % 11) % 10;
                if (parseInt(cpf[t]) !== digito) return false;
            }

            return true;
        }

        // ===== Função que aplica a máscara enquanto digita =====
        function aplicarMascara(input) {
            let valor = input.value.replace(/\D/g, '').slice(0, 11);
            valor = valor.replace(/(\d{3})(\d)/, '$1.$2');
            valor = valor.replace(/(\d{3})(\d)/, '$1.$2');
            valor = valor.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
            input.value = valor;
        }

        // ===== Função principal chamada pelo botão =====
        function validar() {
            const input = document.getElementById('cpf');
            const resultado = document.getElementById('resultado');
            const cpf = input.value.trim();

            // Remove classes de estado anterior
            input.classList.remove('valido', 'invalido');
            resultado.className = 'resultado';

            // Verifica se o campo está vazio
            if (cpf === '') {
                resultado.textContent = 'Por favor, digite um CPF.';
                resultado.classList.add('erro');
                return;
            }

            // Executa a validacao
            if (validarCPF(cpf)) {
                resultado.textContent = '✅ CPF válido!';
                resultado.classList.add('sucesso');
                input.classList.add('valido');
            } else {
                resultado.textContent = '❌ CPF inválido!';
                resultado.classList.add('erro');
                input.classList.add('invalido');
            }
        }

        // ===== Eventos =====
        const campoCpf = document.getElementById('cpf');

        // Aplica mascara enquanto o usuario digita
        campoCpf.addEventListener('input', function () {
            aplicarMascara(this);
        });

        // Permite validar pressionando Enter
        campoCpf.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                validar();
            }
        });
    </script>
</body>
</html>
